<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Работа с базой данных</title>

  <style>
    body {
      max-width: 520px;
      margin: 40px auto;
      padding: 0 16px;
      font: 16px Arial, sans-serif;
    }

    h1 { font-size: 26px; }
    h2 { font-size: 20px; }

    fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
    label { display: block; margin-bottom: 4px; }

    input {
      box-sizing: border-box;
      display: block;
      width: 100%;
      margin-bottom: 12px;
      padding: 8px;
      font: inherit;
    }

    button { padding: 8px 12px; font: inherit; }
    #result { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>

<body>
  <h1>Работа с базой данных</h1>

  <form id="message-form">
    <fieldset id="controls">
      <label for="username">Имя пользователя:</label>
      <input id="username" type="text" maxlength="50" required>

      <label for="message">Сообщение:</label>
      <input id="message" type="text" maxlength="200" required>

      <button type="submit">Записать в БД</button>
      <button id="read-button" type="button">Прочитать из БД</button>
    </fieldset>
  </form>

  <h2>Результат:</h2>
  <p id="result" role="status">Ожидание действий.</p>

  <!-- Подключаем библиотеку Supabase. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Вставь сюда адрес проекта и публичный ключ из Supabase → Connect.
    const SUPABASE_URL = "https://YOUR_PROJECT_REF.supabase.co";
    const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";

    const form = document.getElementById("message-form");
    const controls = document.getElementById("controls");
    const usernameInput = document.getElementById("username");
    const messageInput = document.getElementById("message");
    const result = document.getElementById("result");

    let db;

    // Создаём клиент при первом обращении к базе.
    function getDatabase() {
      if (db) {
        return db;
      }

      if (SUPABASE_URL.includes("YOUR_PROJECT_REF") ||
          SUPABASE_KEY === "sb_publishable_OjxMsVNljyC78Bl_4EJI_w_iMVYU95x") {
        throw new Error("Укажи Project URL и Publishable key в index.html.");
      }

      if (!window.supabase) {
        throw new Error("Библиотека Supabase не загрузилась.");
      }

      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: false }
      });

      return db;
    }

    async function writeMessage(event) {
      event.preventDefault(); // Форма отправляется без перезагрузки страницы.

      const username = usernameInput.value.trim();
      const message = messageInput.value.trim();

      if (!username || !message) {
        result.textContent = "Заполни оба поля.";
        return;
      }

      controls.disabled = true;
      result.textContent = "Записываю…";

      try {
        // Добавляем одну строку с именем и сообщением.
        const { error } = await getDatabase()
          .from("demo_messages")
          .insert({ username: username, message: message });

        if (error) {
          throw error;
        }

        messageInput.value = "";
        result.textContent = "Запись добавлена в БД.";
      } catch (error) {
        result.textContent = "Ошибка записи. " + error.message;
      } finally {
        controls.disabled = false;
      }
    }

    async function readMessages() {
      controls.disabled = true;
      result.textContent = "Читаю записи…";

      try {
        // Читаем имя и сообщение. Новые записи идут первыми.
        const { data, error } = await getDatabase()
          .from("demo_messages")
          .select("username, message")
          .order("created_at", { ascending: false })
          .limit(20);

        if (error) {
          throw error;
        }

        const lines = [];

        for (const row of data) {
          lines.push(row.username + ": " + row.message);
        }

        if (lines.length === 0) {
          result.textContent = "Записей пока нет.";
        } else {
          result.textContent = lines.join("\n");
        }
      } catch (error) {
        result.textContent = "Ошибка чтения. " + error.message;
      } finally {
        controls.disabled = false;
      }
    }

    form.addEventListener("submit", writeMessage);
    document.getElementById("read-button").addEventListener("click", readMessages);
  </script>
</body>
</html>
